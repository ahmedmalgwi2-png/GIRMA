<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIRMA — Growth, Innovation, Resources, Markets &amp; Access</title>
    <meta
      name="description"
      content="GIRMA connects entrepreneurs, innovators, and ambitious individuals across Nigeria and Africa to verified funding, opportunities, markets, knowledge, and mentorship."
    />
    <meta property="og:title" content="GIRMA — Where Potential Meets Access" />
    <meta
      property="og:description"
      content="AI-powered digital ecosystem for African entrepreneurs, SMEs, startups, students, mentors, and opportunity providers."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('girma_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8F7F1] text-[#17231F] dark:bg-[#0B110F] dark:text-[#ECF1EE] antialiased selection:bg-[#123C32] selection:text-[#F8F7F1] dark:selection:bg-[#1F7A59] dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
